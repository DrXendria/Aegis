<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="../icons/icon-48.png" alt="Aegis Vault" width="20" height="20">
      <span>Aegis Vault</span>
    </div>
    <div class="header-right">
      <span id="status-pill" class="pill pill-muted">Checking...</span>
      <button id="settings-btn" type="button" class="icon-btn" title="Pairing settings" aria-label="Pairing settings">
        &#9881;
      </button>
    </div>
  </header>

  <section id="pairing-panel" class="panel hidden">
    <h2>Pair with Aegis Desktop</h2>
    <p class="muted">Open Aegis Vault Desktop &rarr; <strong>Profile</strong> and copy your local pairing token.</p>
    <input id="token-input" type="password" placeholder="Paste 32-character pairing token..." autocomplete="off">
    <div class="row">
      <button id="save-token-btn" type="button" class="btn primary">Connect</button>
      <button id="cancel-token-btn" type="button" class="btn">Cancel</button>
    </div>
    <p id="pairing-error" class="error hidden"></p>
  </section>

  <main id="main-panel" class="main hidden">
    <div class="tabs">
      <button id="tab-logins" type="button" class="tab active">Logins</button>
      <button id="tab-cards" type="button" class="tab">Cards</button>
      <button id="tab-sub" type="button" class="tab">+ Subscription</button>
    </div>

    <div id="view-logins">
      <div class="search-wrap">
        <input id="search-input" type="search" placeholder="Search unlocked vault..." autocomplete="off">
      </div>
      <div id="site-label" class="section-label">Matching this site</div>
      <div id="entries-list" class="entries"></div>
      <div class="footer-bar">
        <button id="gen-btn" type="button" class="btn full">Generate &amp; Copy 20-char Password</button>
      </div>
    </div>

    <div id="view-cards" class="hidden">
      <div class="section-label" style="padding-top: 10px;">Saved Payment Cards</div>
      <div id="cards-list" class="entries"></div>
    </div>

    <form id="view-sub" class="panel hidden">
      <input id="sub-title" type="text" placeholder="Service (e.g. Netflix, Spotify)" required>
      <div class="row">
        <input id="sub-cost" type="number" step="0.01" placeholder="Monthly cost" required>
        <select id="sub-currency" class="select-input">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="TRY">TRY (₺)</option>
          <option value="GBP">GBP (£)</option>
          <option value="RUB">RUB (₽)</option>
          <option value="INR">INR (₹)</option>
          <option value="KRW">KRW (₩)</option>
          <option value="CNY">CNY (¥)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="BRL">BRL (R$)</option>
          <option value="PLN">PLN (zł)</option>
          <option value="PHP">PHP (₱)</option>
        </select>
      </div>
      <input id="sub-date" type="date">
      <button id="sub-save-btn" type="submit" class="btn primary full">Save to Aegis Subscriptions</button>
      <p id="sub-msg" class="muted hidden"></p>
    </form>
  </main>

  <section id="empty-state" class="panel hidden">
    <h2 id="empty-title">Aegis Desktop is offline</h2>
    <p id="empty-desc" class="muted">Launch Aegis Vault on your computer and unlock your vault to autofill passwords.</p>
    <button id="retry-btn" type="button" class="btn primary full">Retry Connection</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
