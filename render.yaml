services:
  - type: web
    name: aegis-vault-web
    runtime: node
    plan: free
    rootDir: website
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve:ssr:aegis-web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.1
      - key: NG_CLI_ANALYTICS
        value: "false"
