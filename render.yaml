services:
  - type: web
    name: aegis-vault-web
    runtime: node
    plan: free
    rootDir: website
    buildCommand: npm ci && NG_CLI_ANALYTICS=false npm run build
    startCommand: npm run serve:ssr:aegis-web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
