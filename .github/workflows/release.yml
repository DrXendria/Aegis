name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload Tauri binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.3
          releaseName: 'Aegis Vault v0.1.3 - Zero-Knowledge, 25 Languages & Multi-Platform'
          releaseBody: |
            ### 🛡️ Aegis Vault v0.1.3
            
            - 🔒 **Zero-Knowledge Architecture:** AES-256-GCM + PBKDF2 (600,000 rounds).
            - 🌍 **25 Global Languages:** 100% native localization.
            - ⚠️ **Password Health Alerts:** 90+ day aging detection.
            - 📥 **1-Click Import:** Support for Chrome, Bitwarden, LastPass, and Aegis JSON.
            - 📱 **Mobile & Quick Access:** Quick Fetch, Quick Save bookmarklet, and PWA companion.
            - 💳 **Subscription & Multi-Currency Tracker:** Real-time conversion across 18 currencies.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
