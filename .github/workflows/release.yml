name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload Tauri binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aegis Vault v__VERSION__ - 100% Local Zero-Knowledge Vault'
          releaseBody: |
            ### 🛡️ Aegis Vault v__VERSION__
            
            - 🧩 **Browser Extension (Opera GX / Chrome / Brave / Edge / Firefox):** 100% local Autofill & Auto-Save via authenticated `127.0.0.1` bridge (zero cloud).
            - 🔒 **100% Local Zero-Knowledge Architecture:** AES-256-GCM + PBKDF2 (600,000 rounds), zero cloud dependency.
            - 🔑 **Full Account & Master Password Management:** Change email, Layer-1 account password, Layer-2 Master Password (atomic vault re-encryption), or permanently delete local account.
            - 💱 **22 Currencies (100% Offline):** Smart currency ordering by app language with exact per-currency monthly totals.
            - 💾 **Atomic Saves & Automatic 2-Week Encrypted Disk Backups:** Crash-safe `.tmp` + `.bak` writes and automatic backups in `Documents/Aegis-Backups`.
            - 🌍 **25 Global Languages:** 100% native localization.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  package-extension:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip and attach browser extension to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ZIP_NAME="Aegis_${TAG}_browser-extension.zip"
          (cd browser-extension && zip -r "../${ZIP_NAME}" .)
          gh release upload "${TAG}" "${ZIP_NAME}" --clobber

  update-homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASE_PAT availability
        id: check_pat
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_PAT secret is not set; skipping Homebrew tap update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout DrXendria/homebrew-tap
        if: steps.check_pat.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: DrXendria/homebrew-tap
          token: ${{ secrets.RELEASE_PAT }}
          path: homebrew-tap

      - name: Update Homebrew Cask for new version
        if: steps.check_pat.outputs.enabled == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          DMG_URL="https://github.com/DrXendria/Aegis/releases/download/v${VER}/Aegis_${VER}_aarch64.dmg"
          curl -fsSL "$DMG_URL" -o /tmp/aegis.dmg
          SHA=$(sha256sum /tmp/aegis.dmg | awk '{print $1}')

          cat <<EOF | sed 's/^          //' > homebrew-tap/Casks/aegis-vault.rb
          cask "aegis-vault" do
            arch arm: "aarch64"

            version "${VER}"
            sha256 "${SHA}"

            url "https://github.com/DrXendria/Aegis/releases/download/v#{version}/Aegis_#{version}_#{arch}.dmg"
            name "Aegis Vault"
            desc "100% local, two-layer zero-knowledge password manager"
            homepage "https://github.com/DrXendria/Aegis"

            app "Aegis.app"

            zap trash: [
              "~/Library/Application Support/com.drxendria.aegis",
              "~/Library/Caches/com.drxendria.aegis",
              "~/Library/Preferences/com.drxendria.aegis.plist",
            ]
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aegis-vault.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update aegis-vault to ${VER}"
            git push origin main
          fi

  update-winget:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check RELEASE_PAT availability
        id: check_pat
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_PAT secret is not set; skipping Winget PR."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit Winget package update PR
        if: steps.check_pat.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: DrXendria.Aegis
          installers-regex: 'x64-setup\.exe$'
          token: ${{ secrets.RELEASE_PAT }}

  update-scoop:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check RELEASE_PAT availability
        id: check_pat
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_PAT secret is not set; skipping Scoop bucket update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout DrXendria/scoop-bucket
        if: steps.check_pat.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: DrXendria/scoop-bucket
          token: ${{ secrets.RELEASE_PAT }}
          path: scoop-bucket

      - name: Update Scoop manifest for new version
        if: steps.check_pat.outputs.enabled == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          EXE_URL="https://github.com/DrXendria/Aegis/releases/download/v${VER}/Aegis_${VER}_x64-setup.exe"
          curl -fsSL "$EXE_URL" -o /tmp/aegis-setup.exe
          SHA=$(sha256sum /tmp/aegis-setup.exe | awk '{print $1}')

          mkdir -p scoop-bucket/bucket
          cat <<EOF | sed 's/^          //' > scoop-bucket/bucket/aegis-vault.json
          {
              "version": "${VER}",
              "description": "100% local, two-layer zero-knowledge offline password manager",
              "homepage": "https://aegis-vault-web.onrender.com",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/DrXendria/Aegis/releases/download/v${VER}/Aegis_${VER}_x64-setup.exe#/dl.7z",
                      "hash": "${SHA}"
                  }
              },
              "bin": "aegis.exe",
              "shortcuts": [
                  [
                      "aegis.exe",
                      "Aegis Vault"
                  ]
              ],
              "checkver": {
                  "github": "https://github.com/DrXendria/Aegis"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/DrXendria/Aegis/releases/download/v\$version/Aegis_\$version_x64-setup.exe#/dl.7z"
                      }
                  }
              }
          }
          EOF

          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/aegis-vault.json
          if ! git diff --cached --quiet; then
            git commit -m "Update aegis-vault to ${VER}"
            git push origin main
          fi
