name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload Tauri binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aegis Vault v__VERSION__ - 100% Local Zero-Knowledge Vault'
          releaseBody: |
            ### 🛡️ Aegis Vault v__VERSION__
            
            - 🔒 **100% Local Zero-Knowledge Architecture:** AES-256-GCM + PBKDF2 (600,000 rounds), zero cloud dependency.
            - 🔑 **Two-Layer Local Protection:** Email + PBKDF2-hashed account password + Master Password vault encryption.
            - 💾 **Atomic Saves & Automatic 2-Week Encrypted Disk Backups:** Crash-safe `.tmp` + `.bak` writes and automatic backups in `Documents/Aegis-Backups`.
            - 🌍 **25 Global Languages:** 100% native localization.
            - 📥 **1-Click Import/Export:** Support for Chrome, Bitwarden, LastPass, and Aegis Encrypted v2 JSON.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
